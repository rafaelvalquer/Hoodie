name: Current SwiftShader frozen APK review

# Records candidates only. Mandatory Android CI still compares every baseline.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-screen-review.yml'
      - '.github/scripts/capture-screen-review.py'
      - '.github/scripts/screen-review-runtime.sh'

permissions:
  contents: read
  actions: read

concurrency:
  group: frozen-screen-review
  cancel-in-progress: false

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        label: [capture-a, capture-b]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preservar driver e selecionar as fontes exatas dos APKs
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/hoodie-screen-review-driver"
          mkdir "$driver"
          cp -R .github/scripts "$driver/"
          git rev-parse HEAD > "$driver/driver-commit.txt"
          git fetch --no-tags --depth=1 https://github.com/rafaelvalquer/Hoodie.git 67bd2d7b5925b087c7beb3dd4418ce308a5752ec
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 67bd2d7b5925b087c7beb3dd4418ce308a5752ec
          cp -R "$driver/scripts/." .github/scripts/
          mkdir -p app/build/reports/screen-review
          cp "$driver/driver-commit.txt" app/build/reports/screen-review/
          sha256sum .github/scripts/capture-screen-review.py .github/scripts/run-qa-emulator.sh > app/build/reports/screen-review/driver-sha256.txt
      - name: Recuperar o mesmo par de APKs preservado
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: rafaelvalquer/Hoodie
          run-id: 39584775889
          artifact-ids: 12342336371
          path: ${{ runner.temp }}/screen-review-pair
          merge-multiple: true
      - name: Instalar emulador oficial fixado
        run: bash .github/scripts/install-qa-emulator.sh app/build/reports/screen-review/emulator-install
      - name: Preparar imagem API34 revisão14
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'cmdline-tools;23.0'
          test ! -e "$ANDROID_HOME/cmdline-tools/preinstalled"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/preinstalled"
          ln -s "$ANDROID_HOME/cmdline-tools/23.0" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-34;google_apis;x86_64'
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*14[[:space:]]*$' "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/source.properties"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Registrar host e capturar todos os 222 quadros
        env:
          REVIEW_PAIR_ROOT: ${{ runner.temp }}/screen-review-pair
          REVIEW_CAPTURE_LABEL: ${{ matrix.label }}
          QA_REVIEW_GPU: swiftshader
        run: |
          mkdir -p app/build/reports/screen-review
          lscpu > app/build/reports/screen-review/host-cpu.txt
          free -m > app/build/reports/screen-review/host-memory.txt
          bash .github/scripts/run-qa-emulator.sh 34 google_apis .github/scripts/screen-review-runtime.sh
      - name: Preservar candidatos e falhas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-screen-review-${{ matrix.label }}-${{ github.sha }}
          path: app/build/reports/screen-review/
          if-no-files-found: error
