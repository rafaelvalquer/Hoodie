name: Android CI

# Gate de qualidade em três estágios:
#   QUALITY (unit-tests, lint)  →  BUILD (assemble)  →  ANDROID INTEGRATION (instrumentation)
# Os nomes dos jobs são os checks obrigatórios da proteção da main (docs/ci-branch-protection.md).

on:
  push:
    branches: [main, 'v0.2-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Código principal sem TODO / FIXME / NotImplementedError
        run: |
          if git grep -nE "TODO|FIXME|NotImplementedError" -- app/src/main; then
            echo "::error::Remova TODO/FIXME/NotImplementedError do código principal antes do merge."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Revisão visual de cenas alteradas: mantém o candidato mesmo se o golden falhar.
      - name: Upload candidate scene goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-golden-candidates
          path: |
            app/build/pixel-preview/npc-art-review/scene-goldens-v1-candidate.sha256
            app/build/pixel-preview/new_place_scenes.png
          if-no-files-found: ignore

      # Roda de novo isolado para o resultado aparecer explícito no log do PR.
      - name: Sprite sheets entregues (arte final)
        run: ./gradlew :app:testDebugUnitTest --tests '*ShippedSheetsValidationTest*'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  assemble:
    name: assemble
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
      - name: Sprites finais dentro do APK
        run: |
          for f in hoodie_walk hoodie_idle hoodie_sleep hoodie_work hoodie_transport; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/pixel/hoodie/$f.json" \
              || { echo "::error::$f.json ausente do APK"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumentation:
    name: instrumentation
    runs-on: ubuntu-latest
    needs: assemble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Update AVD command-line tools
        run: |
          # The runner's preinstalled device catalog may predate Pixel 8.
          sdkmanager --install "cmdline-tools;latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device > "$RUNNER_TEMP/avd-devices.txt"
          cat "$RUNNER_TEMP/avd-devices.txt"
          grep -q '"pixel_8"' "$RUNNER_TEMP/avd-devices.txt"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Connected tests (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_8
          cores: 2
          ram-size: 2048M
          heap-size: 256
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell setprop debug.hwui.renderer skiagl
            adb shell settings put system font_scale 1.0
            adb shell settings put secure show_ime_with_hard_keyboard 1
            # Test the virtual keyboard, without Gboard's first-run stylus tutorial.
            adb shell settings put secure stylus_handwriting_enabled 0
            ./gradlew :app:connectedDebugAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

