name: Android CI

# Gate de qualidade em três estágios:
#   QUALITY (unit-tests, lint)  →  BUILD (assemble)  →  ANDROID INTEGRATION (instrumentation)
# Os nomes dos jobs são os checks obrigatórios da proteção da main (docs/ci-branch-protection.md).

on:
  push:
    branches: [main, 'v0.2-*', 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  # Preserve the running evidence; newer commits wait for their own full run.
  cancel-in-progress: false

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Preservar o fixture original do backup V1
        run: python3 .github/scripts/verify-backup-contract.py

      - name: Revisão explícita de compatibilidade em PRs
        if: github.event_name == 'pull_request'
        env:
          BACKUP_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BACKUP_REVIEW_BASE"
          python3 .github/scripts/verify-backup-contract.py --base "$BACKUP_REVIEW_BASE"

      - name: Código principal sem TODO / FIXME / NotImplementedError
        run: |
          if git grep -nE "TODO|FIXME|NotImplementedError" -- app/src/main; then
            echo "::error::Remova TODO/FIXME/NotImplementedError do código principal antes do merge."
            exit 1
          fi

      - name: Unit tests
        run: bash .github/scripts/unit-tests.sh

      - name: Validador de bibliotecas nativas (casos positivos e negativos)
        run: python3 .github/scripts/test_verify_native_16kb.py

      - name: Integridade das evidências JUnit
        run: python3 .github/scripts/test_verify_junit.py

      - name: Diagnóstico de foco e ANR do emulador
        run: python3 .github/scripts/test_verify_emulator_window.py
      - name: Bloquear instrumentação após ANR de boot
        run: bash .github/scripts/test-qa-boot-gate.sh

      - name: Evidência de reinício e estado de abertura do APK derivado
        run: python3 .github/scripts/test_summarize_runtime_launches.py

      # Revisão visual de cenas alteradas: mantém o candidato mesmo se o golden falhar.
      - name: Upload candidate scene goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-golden-candidates
          path: |
            app/build/pixel-preview/
          if-no-files-found: ignore

      # Preserve the full suite before the isolated sprite run replaces Gradle's report.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      # Roda de novo isolado para o resultado aparecer explícito no log do PR.
      - name: Sprite sheets entregues (arte final)
        run: ./gradlew :app:testDebugUnitTest --tests '*ShippedSheetsValidationTest*'

      - name: Upload sprite sheet test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprite-sheet-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  assemble:
    name: assemble
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
      - name: Sprites finais dentro do APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-entries.txt"
          for f in hoodie_walk hoodie_idle hoodie_sleep hoodie_work hoodie_transport; do
            grep -q "assets/pixel/hoodie/$f.json" "$RUNNER_TEMP/apk-entries.txt" \
              || { echo "::error::$f.json ausente do APK"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumentation:
    name: instrumentation
    runs-on: ubuntu-latest
    needs: assemble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar emulador oficial fixado
        run: bash .github/scripts/install-qa-emulator.sh
      - name: Compilar os APKs antes de iniciar o emulador
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          ./gradlew --stop
      - name: Update AVD command-line tools
        run: |
          # Pin the catalog and make the emulator action use the installed version.
          # Updating "latest" in place can install into "latest-2" on hosted runners.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;23.0"
          test ! -e "$ANDROID_HOME/cmdline-tools/preinstalled"
          mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/preinstalled"
          ln -s "$ANDROID_HOME/cmdline-tools/23.0" "$ANDROID_HOME/cmdline-tools/latest"
          cat "$ANDROID_HOME/cmdline-tools/latest/source.properties"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device > "$RUNNER_TEMP/avd-devices.txt"
          cat "$RUNNER_TEMP/avd-devices.txt"
          grep -q '"pixel_8"' "$RUNNER_TEMP/avd-devices.txt"
      - name: Preparar imagem API 34
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          image_dir="$ANDROID_HOME/system-images/android-34/google_apis/x86_64"
          evidence=app/build/instrumentation-evidence
          mkdir -p "$evidence"
          for attempt in 1 2 3; do
            if [[ -s "$image_dir/package.xml" && -s "$image_dir/system.img" && -s "$image_dir/source.properties" ]]; then
              break
            fi
            echo "Preparing API 34 system image (download attempt $attempt/3)."
            if "$sdkmanager" --sdk_root="$ANDROID_HOME" --install 'system-images;android-34;google_apis;x86_64' --channel=0 \
                <<< 'y' > "$evidence/sdkmanager-$attempt.log" 2>&1; then
              :
            fi
            cat "$evidence/sdkmanager-$attempt.log"
            if [[ -s "$image_dir/package.xml" && -s "$image_dir/system.img" && -s "$image_dir/source.properties" ]]; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo '::error::System image unavailable after three download attempts; no tests started.'
              exit 1
            fi
            sleep 5
          done
          cp "$image_dir/source.properties" "$evidence/system-image-source.properties"
          cp "$image_dir/package.xml" "$evidence/system-image-package.xml"
          # Match the reviewed image, as well as its emulator executable.
          if ! grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*14[[:space:]]*$' "$image_dir/source.properties"; then
            echo '::error::Reviewed goldens require API 34 Google APIs image revision 14; see captured source.properties.'
            exit 1
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Registrar recursos do runner
        run: |
          mkdir -p app/build/instrumentation-evidence
          nproc > app/build/instrumentation-evidence/host-cpu-count.txt
          lscpu > app/build/instrumentation-evidence/host-cpu-info.txt
          free -m > app/build/instrumentation-evidence/host-memory.txt
      - name: Connected tests (API 34)
        run: bash .github/scripts/run-qa-emulator.sh 34 google_apis .github/scripts/connected-tests.sh
      - name: Identificar os APKs exatos da instrumentação
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          pair = {
              'app': pathlib.Path('app/build/outputs/apk/debug/app-debug.apk'),
              'instrumentation': pathlib.Path('app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'),
          }
          if not all(p.is_file() for p in pair.values()):
              print('APK pair unavailable: compilation did not produce both files.')
              raise SystemExit(0)
          report = {
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'appSourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD:app/src'], text=True).strip(),
              'scope': 'Exact debug APK pair from this instrumentation job; not an R8 release artifact or test approval.',
              'apks': {name: {'path': str(p), 'bytes': p.stat().st_size,
                              'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                       for name, p in pair.items()},
          }
          out = pathlib.Path('app/build/instrumentation-evidence/apk-pair.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/build/instrumentation-evidence/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: ignore
